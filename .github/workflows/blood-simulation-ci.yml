name: Blood Simulation CI

on:
  push:
    branches:
      - main
    paths:
      - "projects/blood-simulation/**"
      - ".github/workflows/blood-simulation-ci.yml"
  pull_request:
    paths:
      - "projects/blood-simulation/**"
      - ".github/workflows/blood-simulation-ci.yml"

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/blood-simulation

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run browser-math tests
        run: npm test

  windows-native:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: projects/blood-simulation

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build
      - name: Build Release
        run: cmake --build build --config Release
      - name: Run native tests
        run: ctest --test-dir build -C Release --output-on-failure
