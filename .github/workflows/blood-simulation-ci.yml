name: Blood Simulation CI

on:
  push:
    branches:
      - main
    paths:
      - "projects/blood-simulation/**"
      - ".github/workflows/blood-simulation-ci.yml"
  pull_request:
    paths:
      - "projects/blood-simulation/**"
      - ".github/workflows/blood-simulation-ci.yml"

jobs:
  node-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/blood-simulation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: npm test
