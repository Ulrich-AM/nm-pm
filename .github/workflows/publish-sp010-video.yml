name: Publish Sprite Projection motion evidence

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-sp010-video.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct motion video
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p projects/sprite-projection/figures
          cat .tmp-video-chunks/part*.txt | tr -d '\r\n' | base64 --decode > projects/sprite-projection/figures/SP010-motion-web.mp4
          echo "56a1f0b244982dbc20b720c78b0d8527383b0685eee0faf8f2de11e5b3b720f8  projects/sprite-projection/figures/SP010-motion-web.mp4" | sha256sum -c -

      - name: Commit video and remove transfer files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp-video-chunks
          rm .github/workflows/publish-sp010-video.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Sprite Projection motion evidence video"
          git push origin HEAD:main
