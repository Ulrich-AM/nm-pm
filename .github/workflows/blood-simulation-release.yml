name: Blood Simulation Release

on:
  push:
    branches:
      - main
    paths:
      - "projects/blood-simulation/RELEASE_REQUEST"
    tags:
      - "blood-simulation-v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: projects/blood-simulation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: release
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          } else {
            $tag = (Get-Content RELEASE_REQUEST -Raw).Trim()
          }
          if ($tag -notmatch '^blood-simulation-v\d+\.\d+\.\d+$') {
            throw "Invalid Blood Simulation release tag: $tag"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Configure
        run: cmake -S . -B build

      - name: Build Release
        run: cmake --build build --config Release

      - name: Run native tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package Phase 2
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/blood_phase2.exe dist/BloodSimulation-Phase2.exe
          Copy-Item README.md dist/README.md
          Copy-Item ARCHITECTURE.md dist/ARCHITECTURE.md
          Copy-Item RELEASES.md dist/RELEASES.md
          Copy-Item ../../AI_DISCLOSURE.md dist/AI_DISCLOSURE.md

          New-Item -ItemType Directory -Force dist/experiments | Out-Null
          Copy-Item experiments/INDEX.md dist/experiments/INDEX.md
          Copy-Item experiments/BS-003.md dist/experiments/BS-003.md
          Copy-Item experiments/BS-004.md dist/experiments/BS-004.md

          New-Item -ItemType Directory -Force dist/site | Out-Null
          Copy-Item DOCUMENTATION.html dist/site/DOCUMENTATION.html

          Compress-Archive -Path dist/* -DestinationPath blood-simulation-windows-x64.zip -Force

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          $notes = @"
          NM-PM milestone release for Blood Simulation Phase 2.

          This release adds improved procedural blood-stain morphology, static continuation across real shared surface edges, sparse tiled persistent blood fields, accumulation, wetness, age, drying, and freezing.

          The native UI has also been rebuilt to match the completed Sprite Projection methodology layout and typography more closely.

          This ZIP contains the current Phase 2 executable. Earlier phase executables remain preserved in their own releases.
          "@

          if (gh release view "$env:RELEASE_TAG" *> $null) {
            throw "Release $env:RELEASE_TAG already exists."
          }

          gh release create "$env:RELEASE_TAG" `
            "blood-simulation-windows-x64.zip" `
            --target "${{ github.sha }}" `
            --title "Blood Simulation $env:RELEASE_TAG" `
            --notes "$notes"
