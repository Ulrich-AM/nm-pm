name: Blood Simulation Release

on:
  push:
    branches:
      - main
    paths:
      - "projects/blood-simulation/RELEASE_REQUEST"
    tags:
      - "blood-simulation-v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: projects/blood-simulation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: release
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          } else {
            $tag = (Get-Content RELEASE_REQUEST -Raw).Trim()
          }
          if ($tag -notmatch '^blood-simulation-v\d+\.\d+\.\d+$') {
            throw "Invalid Blood Simulation release tag: $tag"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Configure
        run: cmake -S . -B build

      - name: Build Release
        run: cmake --build build --config Release

      - name: Run native tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package Phase 5
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/blood_phase5.exe dist/BloodSimulation-Phase5.exe
          Copy-Item README.md dist/README.md
          Copy-Item ARCHITECTURE.md dist/ARCHITECTURE.md
          Copy-Item RELEASES.md dist/RELEASES.md
          Copy-Item ../../AI_DISCLOSURE.md dist/AI_DISCLOSURE.md

          New-Item -ItemType Directory -Force dist/experiments | Out-Null
          Copy-Item experiments/INDEX.md dist/experiments/INDEX.md
          Copy-Item experiments/BS-009.md dist/experiments/BS-009.md
          Copy-Item experiments/BS-010.md dist/experiments/BS-010.md
          Copy-Item experiments/BS-011.md dist/experiments/BS-011.md

          New-Item -ItemType Directory -Force dist/site | Out-Null
          Copy-Item DOCUMENTATION.html dist/site/DOCUMENTATION.html

          Compress-Archive -Path dist/* -DestinationPath blood-simulation-windows-x64.zip -Force

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          $notes = @"
          NM-PM patch release for Blood Simulation Phase 5.

          This patch replaces broad per-cell drip-source competition with dense connected-region outlet selection. Only a few gravity-facing lower-edge outlets may emerge from each dense region, while mist remains non-dripping.

          Dense cores and drip-scale body material now render more opaquely, and hanging tips are darker. Phase 4 remains preserved unchanged. The ZIP contains the patched Phase 5 executable and updated research documentation.
          "@

          if (gh release view "$env:RELEASE_TAG" *> $null) {
            throw "Release $env:RELEASE_TAG already exists."
          }

          gh release create "$env:RELEASE_TAG" `
            "blood-simulation-windows-x64.zip" `
            --target "${{ github.sha }}" `
            --title "Blood Simulation $env:RELEASE_TAG" `
            --notes "$notes"
