name: Blood Simulation Release

on:
  push:
    branches:
      - main
    paths:
      - "projects/blood-simulation/RELEASE_REQUEST"
    tags:
      - "blood-simulation-v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: projects/blood-simulation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: release
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          } else {
            $tag = (Get-Content RELEASE_REQUEST -Raw).Trim()
          }
          if ($tag -notmatch '^blood-simulation-v\d+\.\d+\.\d+$') {
            throw "Invalid Blood Simulation release tag: $tag"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Configure
        run: cmake -S . -B build

      - name: Build Release
        run: cmake --build build --config Release

      - name: Run native tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package Phase 7
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/blood_phase7.exe dist/BloodSimulation-Phase7.exe
          Copy-Item README.md dist/README.md
          Copy-Item ARCHITECTURE.md dist/ARCHITECTURE.md
          Copy-Item RELEASES.md dist/RELEASES.md
          Copy-Item ../../AI_DISCLOSURE.md dist/AI_DISCLOSURE.md

          New-Item -ItemType Directory -Force dist/experiments | Out-Null
          Copy-Item experiments/INDEX.md dist/experiments/INDEX.md
          Copy-Item experiments/BS-012.md dist/experiments/BS-012.md
          Copy-Item experiments/BS-013.md dist/experiments/BS-013.md
          Copy-Item experiments/BS-014.md dist/experiments/BS-014.md
          Copy-Item experiments/BS-015.md dist/experiments/BS-015.md
          Copy-Item experiments/BS-016.md dist/experiments/BS-016.md
          Copy-Item experiments/BS-017.md dist/experiments/BS-017.md

          New-Item -ItemType Directory -Force dist/site | Out-Null
          Copy-Item DOCUMENTATION.html dist/site/DOCUMENTATION.html

          Compress-Archive -Path dist/* -DestinationPath blood-simulation-windows-x64.zip -Force

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          $notes = @"
          NM-PM final milestone release for Blood Simulation Phase 7.

          This release closes the Real-Time Hybrid Blood Simulation for 2.5D Environments study.

          A qualifying fresh wall impact may now create zero, one, or two short surface-local drip streaks. Each streak uses a bounded reservoir from the impact body, follows projected gravity as a narrow line, and may take an occasional deterministic one-cell lateral wiggle. These short streaks remain attached to the surface.

          The Phase 6 reservoir runner remains the separate, rarer floor-reaching drip path that can mature into a hanging tip and world-space droplet.

          E7 performs the final sixteen-impact, 45-second scale/reference sweep. BS-016 documents sparse impact streaks and BS-017 freezes the validated architecture and limitations.

          All previous phase harnesses remain preserved. The ZIP contains the final Phase 7 executable and completed research documentation.
          "@

          if (gh release view "$env:RELEASE_TAG" *> $null) {
            throw "Release $env:RELEASE_TAG already exists."
          }

          gh release create "$env:RELEASE_TAG" `
            "blood-simulation-windows-x64.zip" `
            --target "${{ github.sha }}" `
            --title "Blood Simulation $env:RELEASE_TAG" `
            --notes "$notes"
