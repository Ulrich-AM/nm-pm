name: Blood Simulation Release

on:
  push:
    branches:
      - main
    paths:
      - "projects/blood-simulation/RELEASE_REQUEST"
    tags:
      - "blood-simulation-v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: projects/blood-simulation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: release
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          } else {
            $tag = (Get-Content RELEASE_REQUEST -Raw).Trim()
          }
          if ($tag -notmatch '^blood-simulation-v\d+\.\d+\.\d+$') {
            throw "Invalid Blood Simulation release tag: $tag"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Configure
        run: cmake -S . -B build

      - name: Build Release
        run: cmake --build build --config Release

      - name: Run native tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package Phase 8
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/blood_phase8.exe dist/BloodSimulation-Phase8.exe
          Copy-Item README.md dist/README.md
          Copy-Item ARCHITECTURE.md dist/ARCHITECTURE.md
          Copy-Item RELEASES.md dist/RELEASES.md
          Copy-Item ../../AI_DISCLOSURE.md dist/AI_DISCLOSURE.md

          New-Item -ItemType Directory -Force dist/experiments | Out-Null
          Copy-Item experiments/INDEX.md dist/experiments/INDEX.md
          Copy-Item experiments/BS-012.md dist/experiments/BS-012.md
          Copy-Item experiments/BS-013.md dist/experiments/BS-013.md
          Copy-Item experiments/BS-014.md dist/experiments/BS-014.md
          Copy-Item experiments/BS-015.md dist/experiments/BS-015.md
          Copy-Item experiments/BS-016.md dist/experiments/BS-016.md
          Copy-Item experiments/BS-017.md dist/experiments/BS-017.md
          Copy-Item experiments/BS-018.md dist/experiments/BS-018.md
          Copy-Item experiments/BS-019.md dist/experiments/BS-019.md

          New-Item -ItemType Directory -Force dist/site | Out-Null
          Copy-Item DOCUMENTATION.html dist/site/DOCUMENTATION.html

          Compress-Archive -Path dist/* -DestinationPath blood-simulation-windows-x64.zip -Force

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          $notes = @"
          NM-PM Phase 8 extension for Blood Simulation.

          This milestone preserves the frozen Phase 7 reference and adds impact-fed gravity rivulets.

          Qualifying fresh dense wall impacts may immediately nominate the existing full reservoir runner instead of waiting for the periodic dense-source scan. The runner remains mass-bounded, follows projected world gravity, leaves a narrow persistent trail, matures into the existing hanging-tip stage at the surface edge, and then enters the existing XYZ droplet solver.

          Mist, body-only material, frozen cells, already-seeded neighborhoods and nearby active runners remain ineligible. Phase 7 short impact streaks are preserved and may coexist with the long rivulet.

          BS-019 documents the extension. The ZIP contains the Phase 8 executable and updated research documentation.
          "@

          if (gh release view "$env:RELEASE_TAG" *> $null) {
            throw "Release $env:RELEASE_TAG already exists."
          }

          gh release create "$env:RELEASE_TAG" `
            "blood-simulation-windows-x64.zip" `
            --target "${{ github.sha }}" `
            --title "Blood Simulation $env:RELEASE_TAG" `
            --notes "$notes"
