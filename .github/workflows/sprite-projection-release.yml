name: Sprite Projection Release

on:
  push:
    branches:
      - main
    paths:
      - "projects/sprite-projection/RELEASE_REQUEST"
    tags:
      - "sprite-projection-v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: projects/sprite-projection

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: release
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          } else {
            $tag = (Get-Content RELEASE_REQUEST -Raw).Trim()
          }
          if ($tag -notmatch '^sprite-projection-v\d+\.\d+\.\d+$') {
            throw "Invalid Sprite Projection release tag: $tag"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Configure
        run: cmake -S . -B build

      - name: Build Release
        run: cmake --build build --config Release

      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package Windows build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/vdspr_phase5.exe dist/SpriteProjection-Rigid.exe
          Copy-Item build/Release/vdspr_phase6.exe dist/SpriteProjection-Articulation.exe
          Copy-Item build/Release/vdspr_phase7.exe dist/SpriteProjection-ThreeLink.exe
          Copy-Item README.md dist/README.md
          Copy-Item DOCUMENTATION.html dist/DOCUMENTATION.html
          Copy-Item ARCHITECTURE.md dist/ARCHITECTURE.md
          Copy-Item ../../AI_DISCLOSURE.md dist/AI_DISCLOSURE.md
          Copy-Item DEPENDENCIES.md dist/DEPENDENCIES.md
          Compress-Archive -Path dist/* -DestinationPath sprite-projection-windows-x64.zip -Force

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          $notes = @"
          NM-PM milestone release for the Sprite Projection study.

          The package contains the preserved rigid-object lab, the two-link articulated lab, and the current three-link chain lab, together with the living documentation, architecture notes, dependency information, and AI disclosure.

          See DOCUMENTATION.html for the exact experiment state associated with this release.
          "@

          if (gh release view "$env:RELEASE_TAG" *> $null) {
            throw "Release $env:RELEASE_TAG already exists."
          }

          gh release create "$env:RELEASE_TAG" `
            "sprite-projection-windows-x64.zip" `
            --target "${{ github.sha }}" `
            --title "Sprite Projection $env:RELEASE_TAG" `
            --notes "$notes"
