name: Sprite Projection Release

on:
  push:
    branches:
      - main
    paths:
      - "projects/sprite-projection/RELEASE_REQUEST"
    tags:
      - "sprite-projection-v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: projects/sprite-projection

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: release
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          } else {
            $tag = (Get-Content RELEASE_REQUEST -Raw).Trim()
          }
          if ($tag -notmatch '^sprite-projection-v\d+\.\d+\.\d+$') {
            throw "Invalid Sprite Projection release tag: $tag"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Configure
        run: cmake -S . -B build

      - name: Build Release
        run: cmake --build build --config Release

      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package Windows build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/vdspr_phase5.exe dist/SpriteProjection.exe
          Copy-Item README.md dist/README.md
          Copy-Item DOCUMENTATION.html dist/DOCUMENTATION.html
          Copy-Item ../../AI_DISCLOSURE.md dist/AI_DISCLOSURE.md
          Copy-Item DEPENDENCIES.md dist/DEPENDENCIES.md
          Compress-Archive -Path dist/* -DestinationPath sprite-projection-windows-x64.zip -Force

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          $notes = @"
          First public NM-PM milestone release for the Sprite Projection study.

          Current research state: Phase 5 rigid geometry stress testing, internal harness build 1.7.0.

          Highlights:
          - 40-view yaw x pitch sprite banks
          - NEAR, STRETCH, SHEAR, AFFINE, DUAL, and GRID4 reconstruction
          - screen-space roll reconstruction
          - A1 baseline plus A2 protrusion, A3 thin-structure, A4 concavity, and A5 occlusion stress subjects
          - E3, E4, and E5 quantitative evaluation paths
          - silhouette IoU, symmetric boundary error, and centroid displacement metrics
          - 16-test native validation suite
          - NM-PM living documentation and AI disclosure included in the package

          The attached Windows ZIP is intended as an easy-to-run research checkpoint rather than a final reference implementation.
          "@

          if (gh release view "$env:RELEASE_TAG" *> $null) {
            throw "Release $env:RELEASE_TAG already exists."
          }

          gh release create "$env:RELEASE_TAG" `
            "sprite-projection-windows-x64.zip" `
            --target "${{ github.sha }}" `
            --title "Sprite Projection v0.1.0 - Phase 5 Rigid Stress" `
            --notes "$notes"
