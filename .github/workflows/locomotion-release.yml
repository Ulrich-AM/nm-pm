name: Locomotion Release

on:
  push:
    branches:
      - main
    paths:
      - "projects/locomotion/RELEASE_REQUEST"
    tags:
      - "locomotion-v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: projects/locomotion

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: release
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          } else {
            $tag = (Get-Content RELEASE_REQUEST -Raw).Trim()
          }
          if ($tag -notmatch '^locomotion-v\d+\.\d+\.\d+$') {
            throw "Invalid Locomotion release tag: $tag"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Configure
        run: cmake -S . -B build

      - name: Build Release
        run: cmake --build build --config Release

      - name: Run native tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package locomotion release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/locomotion_phase0.exe dist/Locomotion-LO001-Anatomy.exe
          Copy-Item build/Release/locomotion_phase1.exe dist/Locomotion-LO002-MassSupport.exe
          Copy-Item build/Release/locomotion_phase2.exe dist/Locomotion-LO003-StandingSolver.exe
          Copy-Item build/Release/locomotion_phase3.exe dist/Locomotion-LO004-OneStep.exe
          Copy-Item build/Release/locomotion_phase4.exe dist/Locomotion-LO005-AlternatingSteps.exe
          Copy-Item build/Release/locomotion_phase5.exe dist/Locomotion-LO006-VelocityWalk.exe
          Copy-Item build/Release/locomotion_phase6.exe dist/Locomotion-LO007-ContinuousState.exe
          Copy-Item build/Release/locomotion_phase7.exe dist/Locomotion-LO008-ArticulatedFoot.exe
          Copy-Item build/Release/locomotion_phase8.exe dist/Locomotion-LO009-DynamicStance.exe
          if (Test-Path build/Release/locomotion_phase9.exe) {
            Copy-Item build/Release/locomotion_phase9.exe dist/Locomotion-LO010-KLAW-Reconstruction.exe
          }
          Copy-Item README.md dist/README.md
          Copy-Item ARCHITECTURE.md dist/ARCHITECTURE.md
          Copy-Item RELEASES.md dist/RELEASES.md
          Copy-Item ../../AI_DISCLOSURE.md dist/AI_DISCLOSURE.md

          New-Item -ItemType Directory -Force dist/experiments | Out-Null
          Copy-Item experiments/INDEX.md dist/experiments/INDEX.md
          Copy-Item experiments/LO-001.md dist/experiments/LO-001.md
          Copy-Item experiments/LO-002.md dist/experiments/LO-002.md
          Copy-Item experiments/LO-003.md dist/experiments/LO-003.md
          Copy-Item experiments/LO-004.md dist/experiments/LO-004.md
          Copy-Item experiments/LO-005.md dist/experiments/LO-005.md
          Copy-Item experiments/LO-006.md dist/experiments/LO-006.md
          if (Test-Path experiments/LO-006-FLOW-AUDIT.md) {
            Copy-Item experiments/LO-006-FLOW-AUDIT.md dist/experiments/LO-006-FLOW-AUDIT.md
          }
          if (Test-Path experiments/LO-007.md) {
            Copy-Item experiments/LO-007.md dist/experiments/LO-007.md
          }
          if (Test-Path experiments/LO-008.md) {
            Copy-Item experiments/LO-008.md dist/experiments/LO-008.md
          }
          if (Test-Path experiments/LO-009.md) {
            Copy-Item experiments/LO-009.md dist/experiments/LO-009.md
          }
          if (Test-Path experiments/LO-010.md) {
            Copy-Item experiments/LO-010.md dist/experiments/LO-010.md
          }
          if (Test-Path NEXT.md) {
            Copy-Item NEXT.md dist/NEXT.md
          }

          Copy-Item -Recurse reference dist/reference

          New-Item -ItemType Directory -Force dist/projects/locomotion | Out-Null
          Copy-Item ../../index.html dist/index.html
          Copy-Item index.html dist/projects/locomotion/index.html
          Copy-Item DOCUMENTATION.html dist/projects/locomotion/DOCUMENTATION.html

          @"
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=projects/locomotion/DOCUMENTATION.html">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Locomotion Documentation</title>
          <script>location.replace('projects/locomotion/DOCUMENTATION.html');</script>
          </head><body><p>Opening <a href="projects/locomotion/DOCUMENTATION.html">Locomotion documentation</a>...</p></body></html>
          "@ | Set-Content -Encoding UTF8 dist/DOCUMENTATION.html

          # Historical release executables (from actual GitHub Release assets).
          # Do NOT recursively copy a prior release's versions/ directory.
          New-Item -ItemType Directory -Force dist/versions | Out-Null
          $readmeLines = @("# Historical locomotion executables", "", "Copied from official GitHub Release ZIP assets (primary LO*.exe only).", "", "| Tag | Historical executable |", "| --- | --- |")
          $releases = gh release list --limit 100 --json tagName,isDraft,isPrerelease |
            ConvertFrom-Json |
            Where-Object { $_.tagName -match '^locomotion-v\d+\.\d+\.\d+$' -and -not $_.isDraft -and -not $_.isPrerelease } |
            Sort-Object {
              if ($_.tagName -match 'locomotion-v(\d+)\.(\d+)\.(\d+)') {
                [int]$Matches[1] * 1000000 + [int]$Matches[2] * 1000 + [int]$Matches[3]
              } else { 0 }
            }
          $tmpRoot = Join-Path $env:RUNNER_TEMP "locomotion-historical"
          New-Item -ItemType Directory -Force $tmpRoot | Out-Null
          foreach ($rel in $releases) {
            $tag = $rel.tagName
            if ($tag -eq $env:RELEASE_TAG) { continue }
            $tagDir = Join-Path dist/versions $tag
            New-Item -ItemType Directory -Force $tagDir | Out-Null
            $downloadDir = Join-Path $tmpRoot $tag
            New-Item -ItemType Directory -Force $downloadDir | Out-Null
            try {
              gh release download $tag -p "locomotion-windows-x64.zip" -D $downloadDir --clobber
            } catch {
              Write-Host "Skipping $tag (no locomotion-windows-x64.zip): $_"
              continue
            }
            $zipPath = Join-Path $downloadDir "locomotion-windows-x64.zip"
            if (-not (Test-Path $zipPath)) {
              Write-Host "Skipping $tag (zip missing after download)"
              continue
            }
            $extractDir = Join-Path $downloadDir "extract"
            New-Item -ItemType Directory -Force $extractDir | Out-Null
            Expand-Archive -Path $zipPath -DestinationPath $extractDir -Force
            # Highest-numbered Locomotion-LO*.exe at the ZIP root only (ignore nested versions/).
            $exes = Get-ChildItem -Path $extractDir -Filter "Locomotion-LO*.exe" -File -ErrorAction SilentlyContinue
            if (-not $exes) {
              $exes = Get-ChildItem -Path $extractDir -Filter "Locomotion-LO*.exe" -File -Recurse -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -notmatch '[\\/]versions[\\/]' }
            }
            if (-not $exes) {
              Write-Host "Skipping $tag (no Locomotion-LO*.exe found)"
              Remove-Item -Recurse -Force $downloadDir -ErrorAction SilentlyContinue
              continue
            }
            $primary = $exes | Sort-Object {
              if ($_.Name -match 'LO0*(\d+)') { [int]$Matches[1] } else { 0 }
            } -Descending | Select-Object -First 1
            Copy-Item $primary.FullName (Join-Path $tagDir $primary.Name) -Force
            $readmeLines += "| $tag | $($primary.Name) |"
            Remove-Item -Recurse -Force $downloadDir -ErrorAction SilentlyContinue
            Write-Host "Packaged historical $tag -> $($primary.Name)"
          }
          $readmeLines -join "`n" | Set-Content -Encoding UTF8 dist/versions/README.md
          Remove-Item -Recurse -Force $tmpRoot -ErrorAction SilentlyContinue

          Compress-Archive -Path dist/* -DestinationPath locomotion-windows-x64.zip -Force

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if ($env:RELEASE_TAG -match 'locomotion-v0\.10\.') {
            $notes = @"
          LO-010 KLAW fidelity reconstruction research checkpoint.

          This release packages the LO-010 / Phase 9 paper-literal reconstruction of Bruderlin & Calvert (1989) KLAW (Keyframe-Less Animation of Walking), including the v0.10.1 fidelity pass over the too-approximate v0.10.0 baseline. NM-PM does not claim authorship of KLAW. Natural walking is not claimed solved.

          The ZIP preserves Phase 0-9 executables, living documentation, derived reference-analysis files, and versions/<prior-tag>/ historical primary executables from prior official locomotion releases. The Phase 9 binary is packaged as Locomotion-LO010-KLAW-Reconstruction.exe.
          "@
          } else {
            $notes = @"
          LO-009 Support-Driven Root Flow / Dynamic Stance research checkpoint.

          This release packages the LO-009 / Phase 8 A/B/C stance comparison (kinematic LO-008 baseline, rigid virtual-leg, compliant telescoping) with corrected moving-pivot relative velocity, a near-fixed-length rigid virtual-leg constraint, authoritative dynamic root / pelvis synchronization, and expanded diagnostics. Natural walking is not claimed solved.

          The ZIP preserves Phase 0-8 executables, living documentation, and derived reference-analysis files. The Phase 8 binary is packaged as Locomotion-LO009-DynamicStance.exe.
          "@
          }

          if (gh release view "$env:RELEASE_TAG" *> $null) {
            throw "Release $env:RELEASE_TAG already exists."
          }

          $displayTag = $env:RELEASE_TAG -replace '^locomotion-', ''
          gh release create "$env:RELEASE_TAG" `
            "locomotion-windows-x64.zip" `
            --target "${{ github.sha }}" `
            --title "Locomotion $displayTag" `
            --notes "$notes"
